[project]
name = "hackathon-starter-api"
version = "0.1.0"
description = "FastAPI backend for the Hackathon Starter"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
]

[dependency-groups]
dev = ["ruff>=0.8.0"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
